# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
-   repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: no-commit-to-branch
    -   id: check-executables-have-shebangs
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
        # drizzle-kit emits these without a trailing newline; never hand-edit them.
        exclude: "^server/drizzle/"
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-case-conflict
    -   id: check-json
    -   id: check-toml
    -   id: check-merge-conflict
    -   id: check-symlinks
-   repo: https://github.com/IamTheFij/docker-pre-commit.git
    rev: v3.0.1
    hooks:
    -   id: docker-compose-check
        files: "docker-compose.*.yml"
        exclude: ".*.tpl"
-   repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
    -   id: actionlint
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        exclude: "pnpm-lock.yaml|\\.env\\.schema|docker-compose.*\\.yml"
        args: ['--baseline', '.secrets.baseline']
-   repo: local
    hooks:
    -   id: biome-check
        name: biome check
        entry: pnpm exec biome check --write --no-errors-on-unmatched
        language: system
        types_or: [ts, tsx, javascript, jsx, json]
        pass_filenames: true
    -   id: tsc
        name: tsc --noEmit
        entry: pnpm -r exec tsc --noEmit
        language: system
        types: [ts]
        pass_filenames: false
