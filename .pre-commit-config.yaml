# See https://pre-commit.com for more information
# Standard hooks come from https://github.com/pvarki/config-ci-library
# (pre-commit/configs/typescript.pre-commit-config.yaml). Refresh by replacing
# everything between the BEGIN and END delimiters, then re-applying the two
# DEVIATION comments inside it.
default_install_hook_types:
  - pre-commit
  - commit-msg
# >>> BEGIN AUTOGENERATED SECTION - config-ci-library
# Do not modify this section directly, instead modify the
# components in pre-commit/configs/components/ and run the
# generate script or commit to trigger regeneration
#
# Generated from:
#   - pre-commit/configs/components/common-base.pre-commit-config-component.yaml
#   - pre-commit/configs/components/common-format.pre-commit-config-component.yaml
#   - pre-commit/configs/components/typescript.pre-commit-config-component.yaml
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      # DEVIATION from config-ci-library: server/drizzle/ excluded, for the same
      # reason as the tab hooks below — drizzle-kit's output is generated.
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: "^server/drizzle/"
      - id: check-added-large-files
        stages: [pre-commit]
        exclude: '(poetry|uv|yarn)\.lock$|package-lock\.json$|pnpm-lock\.yaml$'
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-symlinks
        stages: [pre-commit]
  - repo: https://github.com/Lucas-C/pre-commit-hooks-markup
    rev: v1.0.1
    hooks:
      - id: rst-linter
        stages: [pre-commit]
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-crlf
        stages: [pre-commit]
      - id: remove-crlf
        stages: [pre-commit]
      # DEVIATION from config-ci-library: server/drizzle/ added to the excludes.
      # drizzle-kit emits migrations with tabs; they are generated files and
      # rewriting them silently edits applied SQL.
      - id: forbid-tabs
        stages: [pre-commit]
        exclude: '\.go$|go\.(mod|sum)$|^server/drizzle/'
      - id: remove-tabs
        stages: [pre-commit]
        exclude: '\.go$|go\.(mod|sum)$|^server/drizzle/'
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: "poetry.lock|ui/pnpm-lock.yaml"
        args: [--baseline, .secrets.baseline]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Prettier
        # DEVIATION from config-ci-library: json removed. Biome formats json
        # in this repo, and two formatters on one file type fight forever.
        files: \.(yml|yaml|md)$
        # DEVIATION from config-ci-library: lockfile excluded. pnpm owns its
        # format; reformatting it produces churn on every install.
        exclude: '^pnpm-lock\.yaml$'
        args:
          - --tab-width=2
          - --use-tabs=false
          - --cache-location=.prettier_cache
        stages: [pre-commit]
  - repo: local # Local hooks so versions track the project's package.json
    hooks:
      # DEVIATION from config-ci-library: Biome replaces the library's
      # prettier-ts + eslint hooks. Biome is this repo's formatter AND linter
      # (see CLAUDE.md); adding the other two would mean two formatters
      # disagreeing about the same files on every commit. Re-apply this
      # deviation when refreshing the autogenerated section.
      - id: biome-check
        name: Biome (format + lint)
        entry: pnpm exec biome check --write --no-errors-on-unmatched
        language: system
        types_or: [ts, tsx, javascript, jsx, json]
        stages: [pre-commit]
      - id: tsc
        name: TypeScript type check
        entry: pnpm -r exec tsc --noEmit
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
        stages: [pre-commit]
  # >>> END AUTOGENERATED SECTION - config-ci-library
  # Add any repo-specific hooks below this line
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
  - repo: https://github.com/IamTheFij/docker-pre-commit.git
    rev: v3.0.1
    hooks:
      - id: docker-compose-check
        files: "docker-compose.*.yml"
        exclude: ".*.tpl"
